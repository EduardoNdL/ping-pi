    <link rel="stylesheet" href="./../css/style.css" />
</head>

<body>
    <div class="dashboard">
        <div class="header-dash">
            <div class="logo"><a href="../index.html">MERAKI</a></div>
            <nav>
                <ul id="conteudo_header">
                    <li><a href="../index.html#sobre">Sobre</a></li>
                    <li><a href="../index.html#recomenda">Recomende</a></li>
                    <li><a href="dashboard-quiz.html">Quiz</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="ranking.html">Ranking</a></li>
                    <li><a href="#" onclick="limparSessao()">Sair</a></li>
                </ul>
            </nav>
        </div>
        <div class="principal-dash"
            style="gap: 0.5rem; overflow-y: scroll; min-height: 100vh; padding: 1rem; justify-content: flex-start;">
            <h2>Adivinhe o jogo</h2>
            <div style="display: flex; flex-direction: column; gap: 1rem;" class="termo">
                <div id="imagem">
                    <div id="blur0" class="blur-fundo" style="top: 0%; left: 0%;"></div>
                    <div id="blur1" class="blur-fundo" style="top: 0%; left: 50%;"></div>
                    <div id="blur2" class="blur-fundo" style="top: 33.33%; left: 0%;"></div>
                    <div id="blur3" class="blur-fundo" style="top: 33.33%; left: 50%;"></div>
                    <div id="blur4" class="blur-fundo" style="top: 66.66%; left: 0%;"></div>
                    <div id="blur5" class="blur-fundo" style="top: 66.66%; left: 50%;"></div>
                </div>
            </div>
            <div class="resposta-gamedle">
                <input type="text" id="resposta" placeholder="Insira o nome do jogo...">
            </div>
            <div class="botoes-gamedle">
                <div class="button_termo" style="width: 60%;" id="dicaB">
                    <button onclick="dica()">Dica</button>
                </div>
                <div class="button_termo" style="width: 100%;">
                    <button onclick="verificar()">Validar</button>
                </div>
            </div>
            <div id="tentativas" style="overflow-y: unset;"></div>
            <div id="tentativasRestantes" style="display: none;"></div>
            <div id="resultado" style="display: none;"></div>
        </div>
    </div>
</body>
<script src="../js/sessao.js"></script>
<script>
    // window.onload = validarSessao;
</script>
<script>
    const palavrasIndie = [

        {

        },
        {

            dica: "Exploração subterrânea em Hallownest com combates desafiadores.",
            imagem: "../assets/gamedle_jogos/hollowknight.png"
        },
        {
            palavra: "cuphead",
            dica: "Run and gun com visual de desenho animado dos anos 30.",
            imagem: "../assets/gamedle_jogos/cuphead.png"
        },
        {
            palavra: "tunic",
            dica: "Aventura com uma raposa em um mundo cheio de segredos e símbolos.",
            imagem: "../assets/gamedle_jogos/tunic.png"
        },
        {
            palavra: "stardew valley",
            dica: "Simulador de fazenda com vida social e mistérios em cavernas.",
            imagem: "../assets/gamedle_jogos/stardewvalley.png"
        },
        {
            palavra: "slay the spire",
            dica: "Roguelike de cartas onde cada jogada conta na sua sobrevivência.",
            imagem: "../assets/gamedle_jogos/slaythespire.png"
        },
        {
            palavra: "katana zero",
            dica: "Ação frenética com estética neon e narrativa sobre trauma.",
            imagem: "../assets/gamedle_jogos/katana.png"
        },
        {
            palavra: "ori",
            dica: "Plataforma emocional com uma criatura mágica em uma floresta.",
            imagem: "../assets/gamedle_jogos/ori.png"
        },
        {
            palavra: "oxenfree",
            dica: "Narrativa sobrenatural com escolhas em uma ilha assombrada.",
            imagem: "../assets/gamedle_jogos/oxenfree.png"
        },
        {
            palavra: "inscryption",
            dica: "Jogo de cartas com elementos de terror e metalinguagem.",
            imagem: "../assets/gamedle_jogos/inscryption.png"
        },
        {
            palavra: "spiritfarer",
            dica: "Gerencie um barco e ajude espíritos a encontrar paz.",
            imagem: "../assets/gamedle_jogos/spiritfarer.png"
        },
        {
            palavra: "inside",
            dica: "Sucessor espiritual de Limbo com atmosfera tensa e final chocante.",
            imagem: "../assets/gamedle_jogos/inside.png"
        },
        {
            palavra: "the witness",
            dica: "Mundo aberto de puzzles com filosofia e mistério.",
            imagem: "../assets/gamedle_jogos/witness.png"
        },
        {
            palavra: "the case of the golden icon",
            dica: "Aventura investigativa com mistério, arte pixelada e clima noir retrô.",
            imagem: "../assets/gamedle_jogos/thegolden.png"
        },
        {
            palavra: "fez",
            dica: "Gire o mundo 2D para resolver puzzles em 3D.",
            imagem: "../assets/gamedle_jogos/fez.png"
        }
    ];

    window.onload = criar
    let numero;

    function criar() {
        numero = Math.floor(Math.random() * palavrasIndie.length);
        console.log(`palavra sorteada: ${palavrasIndie[numero].palavra}`)
        let imagemIni = document.getElementById("imagem")
        imagemIni.style.backgroundImage = `url(${palavrasIndie[numero].imagem})`
        // for (let i = 0; i < palavrasIndie[numero].palavra.length; i++) {
        //   palavraIni.innerHTML += `<input id="input${i}" type="text" maxlength="1"></input>`
        // }
    }

    let indice = 0
    let historicoBlur = [];
    let tentativasRes = 7
    function verificar() {
        if (tentativasRes < 0) {
            return
        }
        let respostaDigitada = resposta.value

        let tentativas = document.getElementById("tentativas")
        tentativas.innerHTML += `<p id="tentativa${indice}" style="display: flex; padding: 10px">${respostaDigitada}</p>`

        let respostaAtual = document.getElementById(`tentativa${indice}`)

        if (respostaDigitada == palavrasIndie[numero].palavra) {
            for (let i = 0; i < 6; i++) {
                let blur = document.getElementById(`blur${i}`)
                blur.style.display = "none"
            }
            respostaAtual.style.backgroundColor = "lightgreen";
            resultado.style.display = "block"
            resultado.innerText = "Parabéns! Você acertou!";
            tentativasRestantes.innerText = "";
            tentativasRes = -1;
            return
        } else {
            tentativasRes--;
            if (tentativasRes != 0) {
                let numBlur = Math.floor(Math.random() * 6)
                while (historicoBlur.includes(numBlur)) {
                    numBlur = Math.floor(Math.random() * 6)
                }
                let blur = document.getElementById(`blur${numBlur}`)
                blur.style.display = "none"
                historicoBlur.push(numBlur)
            }
            respostaAtual.style.backgroundColor = "crimson";


            if (tentativasRes > 0) {
                tentativasRestantes.style.display = "block"
                tentativasRestantes.innerText = `Você tem ${tentativasRes} tentativa(s) restantes de 7`;
            }
            if (tentativasRes === 1) {
                dicaB.style.display = "none"
            }
            if (tentativasRes === 0) {
                tentativasRestantes.style.display = "block"
                resultado.style.display = "block"
                resultado.innerText = `Você errou. A palavra era: ${palavrasIndie[numero].palavra}`;
                tentativasRestantes.innerText = "Fim de jogo!";
                tentativasRes = -1;
            }
        }
        indice++
    }

    function dica() {
        if (tentativasRes < 0) {
            return
        }
        tentativasRes--
        if (tentativasRes === 1) {
            dicaB.style.display = "none"
        }
        if (tentativasRes > 1) {
            tentativas.innerHTML += `<p id="tentativa${indice}" style="display: flex; padding: 10px">${palavrasIndie[numero].dica}</p>`
            tentativasRestantes.style.display = "block"
            tentativasRestantes.innerText = `Você tem ${tentativasRes} tentativa(s) restantes de 7`;
        }
        indice++
    }

</script>
