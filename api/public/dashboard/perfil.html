                        <div class="foto-perfil" id="avatar_perfil">
                            <div>

                                    <input type="text" id="nome_ipt" name="nomeServer">
                                </div>
                                <div>
                                    <p>Email:</p>
                                    <input type="text" id="email_ipt" name="emailServer">
                                </div>
                            </div>
                            <div class="favoritos-perfil">
                                <div>
                                    <p>Jogo preferido:</p>
                                    <p id="jogoFav">XXXX</p>
                                </div>
                                <div>
                                    <p>Genêro preferido:</p>
                                    <p id="genFav">XXXX</p>
                                </div>
                            </div>
                        </div>
                        <div class="button-perfil">
                            <button type="submit">Atualizar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
<script src="../js/sessao.js"></script>
<script>
    window.onload = () => {
        validarSessao();
        carregar()
    }

    function carregar() {
        const fotoUsuario = sessionStorage.FOTO_USUARIO;
        if (fotoUsuario && fotoUsuario !== 'null' && fotoUsuario !== 'undefined') {
            avatar_perfil.style.backgroundImage = `URL(../assets/uploads/${fotoUsuario})`;
        } else {
            avatar_perfil.style.backgroundImage = "URL(../assets/icones/default.png)";
        }

        nome_ipt.value = sessionStorage.NOME_USUARIO
        email_ipt.value = sessionStorage.EMAIL_USUARIO
        jogoFav.innerText = sessionStorage.JOGO_USUARIO
        genFav.innerText = sessionStorage.GENERO_USUARIO
    };

    const iptIMG = document.getElementById("imagemPerfil");
    const buttonClique = document.getElementById("editPerfil")

    function addImagem() {
        iptIMG.click()
    }

    buttonClique.addEventListener('click', addImagem)

    formAtualizar.addEventListener('submit', function (event) {
        event.preventDefault();

        const formData = new FormData(formAtualizar);

        const usuarioId = sessionStorage.ID_USUARIO;
        if (usuarioId) {
            formData.append('userId', usuarioId);
        }

        const fotoUsuario = sessionStorage.FOTO_USUARIO
        if (fotoUsuario) {
            formData.append('fotoUsuario', fotoUsuario)
        }


        fetch("/usuarios/atualizar", {
            method: "POST",
            body: formData
        })

            .then(response => {
                return response.json()
                    .then(resultado => {

                        if (response.ok) {
                            sessionStorage.FOTO_USUARIO = resultado.usuario.imagemPerfil;
                            sessionStorage.NOME_USUARIO = resultado.usuario.nomePerfil;
                            sessionStorage.EMAIL_USUARIO = resultado.usuario.emailPerfil;

        });
    });
</script>

</html>
