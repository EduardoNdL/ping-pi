                                    <input type="text" id="nome_ipt" name="nomeServer">
                                </div>
                                <div>
                                    <p>Email:</p>
                                    <input type="text" id="email_ipt" name="emailServer">
                                </div>
                            </div>
                            <div class="favoritos-perfil">
                                <div>
                                    <p>Jogo preferido:</p>
                                    <p id="jogoFav">XXXX</p>
                                </div>
                                <div>

                                </div>
                            </div>
                        </div>

                    </div>

</body>
<script src="../js/sessao.js"></script>
<script>
    window.onload = () => {
        validarSessao();
        carregar()
    }

    function carregar() {
        const avatarUrl = sessionStorage.FOTO_USUARIO;
        if (avatarUrl && avatarUrl !== 'null' && avatarUrl !== 'undefined') {
            avatar_perfil.style.backgroundImage = `URL(../assets/uploads/${avatarUrl})`;
            console.log(`URL(../assets/uploads/${avatarUrl})`)
        } else {
            avatar_perfil.style.backgroundImage = "URL(../assets/icones/default.png)";
        }

        nome_ipt.value = sessionStorage.NOME_USUARIO || '';
        email_ipt.value = sessionStorage.EMAIL_USUARIO || '';
        jogoFav.innerText = sessionStorage.JOGO_USUARIO || 'Não definido';
        genFav.innerText = sessionStorage.GENERO_USUARIO || 'Não definido';
    };

    formAtualizar.addEventListener('submit', async (event) => {
        event.preventDefault();

        const formData = new FormData(formAtualizar);

        const userId = sessionStorage.ID_USUARIO;
        if (userId) {
            formData.append('userId', userId);
        } else {
            alert('ID do usuário não encontrado na sessão. Faça login novamente.');
            return;
        }

        try {
            const response = await fetch("/usuarios/atualizar", {
                method: "POST",
                body: formData
            });

            const resultado = await response.json();

            if (response.ok) {
                alert('Perfil atualizado com sucesso!');
                console.log('Resposta do servidor:', resultado);

                sessionStorage.FOTO_USUARIO = resultado.user.imagemPerfil;
                sessionStorage.NOME_USUARIO = resultado.user.nomePerfil;
